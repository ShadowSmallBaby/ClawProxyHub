services:
  cph:
    build: .
    image: clawproxyhub:latest
    container_name: cph
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 首次启动引导管理员（之后以数据库为准，改密码后本变量失效）
      CPH_ADMIN_USERNAME: admin
      CPH_ADMIN_PASSWORD: change-me
      # 可选：首启引导调用密钥
      # CPH_SEED_API_KEY: cph-xxxx
    volumes:
      - ./data:/app/data
