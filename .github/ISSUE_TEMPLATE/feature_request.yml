name: 功能建议
description: 新功能或对现有行为的改进
title: "feat: "
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 现在缺什么，卡在什么场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: component
    attributes:
      label: 相关组件
      options:
        - 核心 / 网关
        - Web 仪表盘
        - 插件与市场
        - Lua / luahost
        - 其他
    validations:
      required: true
